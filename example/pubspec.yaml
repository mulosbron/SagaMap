name: saga_map_example
publish_to: none
description: Example app for the saga_map package.
homepage: https://github.com/mulosbron/SagaMap
repository: https://github.com/mulosbron/SagaMap
version: 0.0.1

dependencies:
  saga_map:
    path: ../
  flutter:
    sdk: flutter
  # The package dropped flutter_svg in 2.0.0. The SVG background modes in this
  # demo are the host's own doing now, so the dependency lives here.
  flutter_svg: ^2.2.4

# For information on the generic Dart part of this file, see the
# following page: https://www.dartlang.org/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/drawable/hero_walk.png
    - assets/drawable/hero_idle.png
    - assets/drawable/map_vertical.png
    - assets/drawable/map_vertical_point.png
    - assets/drawable/map_horizontal.png
    - assets/drawable/map_horizontal_point.png
    - assets/svg/map_vertical.svg
    - assets/svg/map_horizontal.svg

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the demo on a real device or emulator, where widget tests cannot
  # reach: asset decoding, platform text, real frame scheduling.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0