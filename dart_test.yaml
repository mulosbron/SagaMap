tags:
  golden:
    description: >-
      Visual regression tests backed by reference PNGs. Output depends on the
      host renderer, so these can legitimately differ across platforms and
      Flutter versions. Run `flutter test --exclude-tags golden` where the
      reference platform is not available, and
      `flutter test --update-goldens test/golden` after an intended visual
      change.
  platform-parity:
    description: >-
      Pure-Dart suites whose whole point is that they produce identical results
      on every supported runtime. They must be run under a browser as well as
      the VM — `flutter test --platform chrome --tags platform-parity` — because
      the divergence they guard against (web ints are doubles, so 64-bit shifts
      have no meaning) is invisible to a VM-only run. CI runs both.
