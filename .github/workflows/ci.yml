name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Flutter version is pinned, not floated. Goldens are pixel comparisons and
# a framework upgrade can shift antialiasing by a hair — a floating version
# turns that into a red build on an unrelated pull request, on a day nobody
# touched the renderer.
env:
  FLUTTER_VERSION: 3.41.6

jobs:
  analyze-and-test:
    name: analyze + test (vm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Restores the pinned SDK and the pub cache between runs.
          cache: true
      - run: flutter pub get
      # `example/` is a consumer of this package and the first thing a reader
      # copies from. It was analysed and formatted by nobody.
      - run: flutter pub get --directory example
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter analyze --no-fatal-infos example
      - run: flutter test

      # Goldens are the one failure a log cannot explain, so keep the images.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore

  web:
    name: test (chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Restores the pinned SDK and the pub cache between runs.
          cache: true
      - run: flutter pub get
      # stableHash has to agree on vm and on web, where an int is a double and
      # a 64-bit shift has no meaning — the defect that made one seed generate
      # two different worlds. A VM-only run cannot see it.
      #
      # Bounded by directory *and* filtered by tag, and it needs both.
      #
      # `--tags platform-parity` alone does not work: the tag filter still
      # *loads* every suite under the browser, and the ones that touch dart:io
      # fail to load before any filtering happens. Naming one file instead —
      # what this job used to do — meant that tagging a second suite silently
      # ran it nowhere, while dart_test.yaml claimed "CI runs both".
      #
      # `test/parity/` is therefore the home of every platform-parity suite,
      # and a hygiene test in release_hygiene_test.dart fails if a tagged file
      # is put anywhere else. Adding a parity suite is now one decision — which
      # directory — rather than a decision plus a CI edit nobody remembers.
      #
      # Not verified on the machine this was written on: Chrome would not
      # launch for the test runner there, for any suite including a trivial
      # one, hanging with no output. See CONTRIBUTING.md. The CI run is the
      # only real check.
      - run: flutter test --platform chrome --tags platform-parity test/parity

  publishable:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Restores the pinned SDK and the pub cache between runs.
          cache: true
      - run: flutter pub get
      # A gate, not a formality: 2.0.0 shipped with a package that would not
      # have published, and with an archive three quarters demo artwork.
      - run: flutter pub publish --dry-run
