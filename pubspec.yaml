name: saga_map
description: A Flutter package for building responsive world-map level progression UIs with custom host-provided assets.
version: 2.0.0
homepage: https://github.com/mulosbron/SagaMap
repository: https://github.com/mulosbron/SagaMap
issue_tracker: https://github.com/mulosbron/SagaMap/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # equatable + fast_noise: ProceduralBiomeGenerator.
  equatable: ^2.0.5
  fast_noise: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  # This package is consumed from host apps.
  # Host applications provide and register their own background assets.
